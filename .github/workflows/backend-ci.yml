name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: metopa_ci
          POSTGRES_USER: metopa
          POSTGRES_PASSWORD: metopa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metopa -d metopa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/metopa_ci
      SPRING_DATASOURCE_USERNAME: metopa
      SPRING_DATASOURCE_PASSWORD: metopa_test
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_TEST_DATABASE_REPLACE: 'NONE'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
